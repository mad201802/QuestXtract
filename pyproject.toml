[project]
name = "questxtract"
version = "0.1.0"
description = "Extract questions from lecture audio and video and turn them into quizzes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "mad201802", email = "md148@hdm-stuttgart.de" }
]
keywords = ["lecture", "transcript", "question-extraction", "asr", "quiz"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.10"
# Base install is stdlib-only while stages 1, 2 and 5 are stubs; faster-whisper and numpy
# land with the issues that implement them (docs/architecture.md 13.2).
dependencies = ["av>=14.0"]

[project.optional-dependencies]
llm = ["openai>=1.0"]

[project.urls]
Homepage = "https://github.com/mad201802/QuestXtract"
Repository = "https://github.com/mad201802/QuestXtract"
Issues = "https://github.com/mad201802/QuestXtract/issues"

[project.scripts]
questxtract = "questxtract.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib --cov=questxtract --cov-report=term-missing --cov-fail-under=70"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.10"
packages = ["questxtract"]
strict = true

# The LLM layer is the optional `questxtract[llm]` extra, imported inside the functions.
[[tool.mypy.overrides]]
module = ["openai"]
ignore_missing_imports = true
