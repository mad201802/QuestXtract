name: Release

# Push a tag `vX.Y.Z` matching `version` in pyproject.toml, with a `## X.Y.Z` section in
# CHANGELOG.md, and this builds the package, creates the GitHub Release with that CHANGELOG
# section as its notes, and publishes to PyPI when the repository variable PUBLISH_TO_PYPI is
# 'true'. See CONTRIBUTING.md "Releasing".

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # Fails the release before anything is built if the tag, pyproject.toml and CHANGELOG.md
      # disagree.
      - run: python3 scripts/release_notes.py "${{ github.ref_name }}" -o release-notes.md
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            dist/
            release-notes.md
          if-no-files-found: error

  publish:
    needs: build
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/questxtract/
    permissions:
      id-token: write # lets `uv publish` use PyPI trusted publishing if no token is set
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
      - uses: astral-sh/setup-uv@v7
      - run: uv publish dist/*
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    needs: [build, publish]
    # Runs when PyPI publishing is skipped, but not when it failed.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.publish.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
      # A Release created by hand in the GitHub UI (which also pushes the tag) gets the files
      # attached and its notes replaced instead of failing the job.
      - run: |
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" dist/* --repo "$REPO" --title "$TAG" --notes-file release-notes.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
