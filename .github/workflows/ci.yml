name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev --python 3.10
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - uses: actions/cache@v4
        with:
          path: .cache/qti-xsd
          key: qti-xsd-${{ hashFiles('scripts/fetch_qti_xsd.py') }}
      - run: uv run python scripts/fetch_qti_xsd.py
      - run: uv run pytest
        env:
          QUESTXTRACT_REQUIRE_QTI_XSD: "1"

  ci:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: ${{ needs.test.result == 'success' }}
