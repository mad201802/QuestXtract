name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # release.yml runs the same checks before it builds

jobs:
  test:
    runs-on: ubuntu-latest
    # Every uv run on 3.10 too: without this, .python-version (3.13) makes uv run replace the venv.
    env:
      UV_PYTHON: "3.10"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras --dev --python 3.10
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - uses: actions/cache@v6
        with:
          path: .cache/qti-xsd
          key: qti-xsd-${{ hashFiles('scripts/fetch_qti_xsd.py') }}
      - run: uv run python scripts/fetch_qti_xsd.py
      # A virtual display, so tests/test_gui_window.py runs instead of being skipped.
      - run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - run: xvfb-run -a uv run pytest
        env:
          QUESTXTRACT_REQUIRE_QTI_XSD: "1"

  # Installs the built wheel the way a user would: a fresh venv that resolves the wheel's own
  # dependency list from PyPI (not uv.lock), run outside the checkout so nothing imports src/.
  wheel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build --wheel
      - run: uv venv --python ${{ matrix.python }} "$RUNNER_TEMP/venv"
      - run: uv pip install --python "$RUNNER_TEMP/venv" dist/*.whl
      - name: version matches pyproject.toml
        working-directory: ${{ runner.temp }}
        run: |
          test "$("$RUNNER_TEMP/venv/bin/python" -I -c 'import questxtract; print(questxtract.__version__)')" \
            = "$(uv version --short --project "$GITHUB_WORKSPACE")"
      - name: --help lists the commands
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/venv/bin/questxtract" --help > help.txt
          for c in process transcribe eval; do grep -qw "$c" help.txt; done
      - name: process a transcript offline
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/venv/bin/questxtract" process \
            "$GITHUB_WORKSPACE/tests/data/ttk4225_2026_09_14.transcript.json" -o - > questions.json
      # Installed only now, so the run above saw the bare install.
      - name: output validates against the schema in the wheel
        working-directory: ${{ runner.temp }}
        run: |
          uv pip install --python "$RUNNER_TEMP/venv" jsonschema
          "$RUNNER_TEMP/venv/bin/python" -I -c '
          import json
          from importlib.resources import files
          import jsonschema
          schema = files("questxtract").joinpath("questions.schema.json").read_text(encoding="utf-8")
          with open("questions.json", encoding="utf-8") as f:
              jsonschema.validate(json.load(f), json.loads(schema))
          '

  # Known vulnerabilities in the locked dependencies. pip-audit applies the lock's environment
  # markers for the Python it runs on, so both ends of the supported range are audited.
  audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: >-
          uv export --locked --all-extras --no-emit-project --format requirements.txt
          -o "$RUNNER_TEMP/requirements.txt"
      # Ignored: the filelock advisories with no fix on Python 3.10 (#239, #246).
      - run: >-
          uvx --python ${{ matrix.python }} pip-audit==2.10.1 --require-hashes --disable-pip
          -r "$RUNNER_TEMP/requirements.txt"
          --ignore-vuln GHSA-v4x8-3wr5-3wq8 --ignore-vuln GHSA-9vhv-jxww-xfm5
          --ignore-vuln GHSA-567q-5qvw-pf92 --ignore-vuln GHSA-m462-7rxw-wvpg
          --ignore-vuln GHSA-j8f7-rjxc-mr56 --ignore-vuln GHSA-8mx5-7m5m-r77g
          --ignore-vuln GHSA-69hj-f68j-2879 --ignore-vuln GHSA-9c4x-gm8v-wgc4
          --ignore-vuln GHSA-rfpc-qcw5-3pc4 --ignore-vuln GHSA-cwqr-hh33-gh44
          --ignore-vuln GHSA-fq56-3cx3-fjxp --ignore-vuln GHSA-9j6q-wvj5-jgjg
          --ignore-vuln GHSA-6627-m3xw-93mp

  ci:
    if: always()
    needs: [test, wheel, audit]
    runs-on: ubuntu-latest
    steps:
      - run: ${{ needs.test.result == 'success' && needs.wheel.result == 'success' && needs.audit.result == 'success' }}
